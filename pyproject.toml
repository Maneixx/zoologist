[project]
name = "zoologist"
version = "0.1.0"
description = "Classifying penguin"
readme = "README.md"
authors = [
    { name = "Julien Monmaneix", email = "julienmx@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pandas<3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
zoologist = "zoologist:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
]
